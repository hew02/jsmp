name: Build web component

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install esbuild
        run: go install github.com/evanw/esbuild/cmd/esbuild@latest

      - name: Create dist directory
        run: mkdir -p dist

      - name: Minify JavaScript
        run: |
          "$(go env GOPATH)/bin/esbuild" \
            jsmp.js \
            --minify \
            --outfile=dist/jsmp.min.js

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest build" \
              --notes "Automatically updated build from the main branch"

          gh release upload latest \
            dist/my-component.min.js \
            --clobber
