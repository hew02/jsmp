name: Build web component

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install esbuild
        run: go install github.com/evanw/esbuild/cmd/esbuild@latest

      - name: Create dist directory
        run: mkdir -p dist

      - name: Minify JavaScript
        run: |
          "$(go env GOPATH)/bin/esbuild" \
            jsmp.js \
            --minify \
            --outfile=dist/jsmp.min.js

      - name: Publish generated file to cdn branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin cdn:cdn || true

          git checkout cdn 2>/dev/null || git checkout --orphan cdn

          git rm -rf . 2>/dev/null || true
          mkdir -p dist
          cp "$GITHUB_WORKSPACE/dist/jsmp.min.js" dist/jsmp.min.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/jsmp.min.js
          git commit -m "Update CDN build" || echo "No changes to commit"
          git push origin cdn

      - name: Purge jsDelivr cache
        uses: gacts/purge-jsdelivr-cache@v1
        with:
          url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@cdn/dist/my-component.min.js
