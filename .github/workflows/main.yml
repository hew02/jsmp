name: Build web component

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install esbuild
        run: go install github.com/evanw/esbuild/cmd/esbuild@latest

      - name: Create dist directory
        run: mkdir -p dist

      - name: Minify JavaScript
        run: |
          "$(go env GOPATH)/bin/esbuild" \
            jsmp.js \
            --minify \
            --outfile=dist/jsmp.min.js

      - name: Upload generated file
        uses: actions/upload-artifact@v4
        with:
          name: jsmp
          path: dist/jsmp.min.js
