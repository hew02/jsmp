name: Build web component

permissions:
  contents: write

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install esbuild
        run: go install github.com/evanw/esbuild/cmd/esbuild@latest

      - name: Create dist directory
        run: mkdir -p dist

      - name: Minify JavaScript
        run: |
          "$(go env GOPATH)/bin/esbuild" \
            jsmp.js \
            --minify \
            --outfile=dist/jsmp.min.js

      - name: Publish generated file to cdn branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin cdn:cdn || true

          if git ls-remote --exit-code --heads origin latest >/dev/null 2>&1; then
            git fetch origin latest
            git checkout -B latest origin/latest
          else
            git checkout --orphan latest
            git rm -rf . || true
          fi

          git add dist/jsmp.min.js
          git commit -m "Update CDN build" || echo "No changes to commit"
          git push origin latest

      - name: Purge jsDelivr cache
        uses: gacts/purge-jsdelivr-cache@v1
        with:
          url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@cdn/dist/my-component.min.js
